        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                background: #0b1530;
                font-family: "Outfit", sans-serif;
            }

            input,
            select {
                font-family: "Outfit", sans-serif;
            }

            input:focus,
            select:focus {
                outline: none;
            }

            button {
                font-family: "Outfit", sans-serif;
            }

            @keyframes twFloat {
                0% {
                    transform: translateY(0) translateX(0);
                    opacity: 0;
                }
                10% {
                    opacity: 0.7;
                }
                90% {
                    opacity: 0.5;
                }
                100% {
                    transform: translateY(-110vh) translateX(30px);
                    opacity: 0;
                }
            }

            @keyframes twGlowPulse {
                0%,
                100% {
                    opacity: 0.35;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.65;
                    transform: scale(1.15);
                }
            }

            @keyframes twCardIn {
                0% {
                    opacity: 0;
                    transform: translateY(28px) scale(0.97);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            @keyframes twFieldIn {
                0% {
                    opacity: 0;
                    transform: translateY(14px);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes twShake {
                0%,
                100% {
                    transform: translateX(0);
                }
                20% {
                    transform: translateX(-7px);
                }
                40% {
                    transform: translateX(7px);
                }
                60% {
                    transform: translateX(-4px);
                }
                80% {
                    transform: translateX(4px);
                }
            }

            @keyframes twPop {
                0% {
                    opacity: 0;
                    transform: scale(0.6);
                }
                70% {
                    transform: scale(1.06);
                }
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            @keyframes twSpin {
                to {
                    transform: rotate(360deg);
                }
            }

            @keyframes twScan {
                0%,
                100% {
                    top: 6%;
                }
                50% {
                    top: 88%;
                }
            }

            @keyframes twCheckDraw {
                to {
                    stroke-dashoffset: 0;
                }
            }

            .hidden {
                display: none !important;
            }

            .page {
                position: relative;
                min-height: 100vh;
                overflow: hidden;
                background-image: url("img/FONDO-TW-CONNECT.png");
                background-size: cover;
                background-position: center;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 48px 24px;
                box-sizing: border-box;
            }

            .page-overlay {
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    ellipse 60% 80% at 50% 50%,
                    rgba(6, 12, 32, 0) 0%,
                    rgba(6, 12, 32, 0.55) 100%
                );
                pointer-events: none;
            }

            .glow {
                position: absolute;
                border-radius: 50%;
                filter: blur(40px);
                animation: twGlowPulse 7s ease-in-out infinite;
                pointer-events: none;
            }

            .glow--lime {
                width: 560px;
                height: 560px;
                left: -160px;
                bottom: -200px;
                background: radial-gradient(
                    circle,
                    rgba(139, 197, 64, 0.28) 0%,
                    rgba(139, 197, 64, 0) 70%
                );
            }

            .glow--blue {
                width: 640px;
                height: 640px;
                right: -200px;
                top: -220px;
                filter: blur(50px);
                background: radial-gradient(
                    circle,
                    rgba(70, 120, 255, 0.3) 0%,
                    rgba(70, 120, 255, 0) 70%
                );
                animation-duration: 9s;
                animation-delay: 1.5s;
            }

            #particles {
                position: absolute;
                inset: 0;
                overflow: hidden;
                pointer-events: none;
            }

            .card {
                position: relative;
                width: 100%;
                max-width: 460px;
                border-radius: 24px;
                background: rgba(10, 18, 42, 0.62);
                backdrop-filter: blur(22px) saturate(1.3);
                -webkit-backdrop-filter: blur(22px) saturate(1.3);
                border: 1px solid rgba(255, 255, 255, 0.14);
                box-shadow:
                    0 30px 80px rgba(0, 0, 0, 0.55),
                    0 0 0 1px rgba(139, 197, 64, 0.08),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
                animation: twCardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
                overflow: hidden;
            }

            .card-accent {
                height: 3px;
                background: linear-gradient(
                    90deg,
                    rgba(139, 197, 64, 0) 0%,
                    #8bc540 30%,
                    #c4f24a 50%,
                    #8bc540 70%,
                    rgba(139, 197, 64, 0) 100%
                );
            }

            .card-body {
                padding: 40px 40px 36px;
            }

            .loader {
                text-align: center;
                color: rgba(255, 255, 255, 0.65);
                font-size: 15px;
                padding: 20px 0;
            }

            .loader-spinner {
                width: 28px;
                height: 28px;
                border: 2.5px solid rgba(255, 255, 255, 0.15);
                border-top-color: #c4f24a;
                border-radius: 50%;
                display: inline-block;
                animation: twSpin 0.7s linear infinite;
                margin-bottom: 14px;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 6px 14px;
                border-radius: 999px;
                background: rgba(139, 197, 64, 0.12);
                border: 1px solid rgba(139, 197, 64, 0.35);
                margin-bottom: 18px;
            }

            .badge-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #a3e635;
                box-shadow: 0 0 8px #a3e635;
            }

            .badge-text {
                font-size: 11.5px;
                font-weight: 600;
                letter-spacing: 2.5px;
                color: #c4f24a;
                text-transform: uppercase;
            }

            .header-block {
                text-align: center;
                animation: twFieldIn 0.6s 0.15s cubic-bezier(0.22, 1, 0.36, 1)
                    both;
            }

            .header-title {
                margin: 0;
                font-size: 26px;
                font-weight: 800;
                color: #ffffff;
                letter-spacing: -0.5px;
            }

            .header-sub {
                margin: 10px 0 0;
                font-size: 14.5px;
                font-weight: 400;
                color: rgba(255, 255, 255, 0.65);
                line-height: 1.5;
            }

            .header-event {
                font-size: 22px;
                font-weight: 700;
                color: #c4f24a;
            }

            .fields {
                display: flex;
                flex-direction: column;
                gap: 16px;
                margin-top: 30px;
            }

            .field-wrap {
                animation-name: twFieldIn;
                animation-duration: 0.6s;
                animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
                animation-fill-mode: both;
            }

            .field-inner {
                position: relative;
            }

            .field-inner.shake {
                animation: twShake 0.45s ease;
            }

            .field-input {
                width: 100%;
                box-sizing: border-box;
                padding: 24px 44px 10px 18px;
                font-size: 15.5px;
                font-weight: 500;
                color: #ffffff;
                background: rgba(255, 255, 255, 0.055);
                border: 1.5px solid rgba(255, 255, 255, 0.14);
                border-radius: 14px;
                transition:
                    border-color 0.25s,
                    background 0.25s,
                    box-shadow 0.25s;
                caret-color: #c4f24a;
            }

            .field-input:focus {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(163, 230, 53, 0.75);
                box-shadow: 0 0 0 4px rgba(163, 230, 53, 0.13);
            }

            .field-input.error {
                border-color: rgba(255, 110, 140, 0.7);
            }

            .field-input.filled + .field-label,
            .field-input:focus + .field-label {
                top: 9px;
                font-size: 11px;
            }

            .field-input.error + .field-label {
                color: #ff8fa3;
            }

            .field-input:focus + .field-label {
                color: #c4f24a;
            }

            .field-label {
                position: absolute;
                left: 18px;
                top: 17px;
                font-size: 15px;
                font-weight: 500;
                color: rgba(255, 255, 255, 0.55);
                pointer-events: none;
                transition:
                    top 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                    font-size 0.22s,
                    color 0.22s;
                letter-spacing: 0.2px;
            }

            .field-valid {
                position: absolute;
                right: 16px;
                top: 0;
                bottom: 0;
                margin: auto 0;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: rgba(139, 197, 64, 0.18);
                display: none;
                align-items: center;
                justify-content: center;
                animation: twPopValid 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
                pointer-events: none;
            }

            .field-valid::after {
                content: "";
                width: 8px;
                height: 5px;
                margin-top: -1px;
                border-left: 2px solid #a3e635;
                border-bottom: 2px solid #a3e635;
                transform: rotate(-45deg);
                display: block;
            }

            @keyframes twPopValid {
                0% {
                    opacity: 0;
                    transform: scale(0.6);
                }
                70% {
                    transform: scale(1.06);
                }
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            .field-input.valid ~ .field-valid {
                display: flex;
            }

            .field-select {
                width: 100%;
                box-sizing: border-box;
                padding: 17px 40px 17px 18px;
                font-size: 15.5px;
                font-weight: 500;
                color: rgba(255, 255, 255, 0.55);
                background: rgba(255, 255, 255, 0.055);
                border: 1.5px solid rgba(255, 255, 255, 0.14);
                border-radius: 14px;
                transition:
                    border-color 0.25s,
                    background 0.25s,
                    box-shadow 0.25s,
                    color 0.25s;
                appearance: none;
                -webkit-appearance: none;
                -moz-appearance: none;
                cursor: pointer;
            }

            .field-select.filled {
                color: #ffffff;
            }

            .field-select option {
                color: #0b1530;
                background: #ffffff;
            }

            .field-select:focus {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(163, 230, 53, 0.75);
                box-shadow: 0 0 0 4px rgba(163, 230, 53, 0.13);
            }

            .field-select.error {
                border-color: rgba(255, 110, 140, 0.7);
            }

            .field-select-arrow {
                position: absolute;
                right: 18px;
                top: 50%;
                width: 9px;
                height: 9px;
                border-right: 2px solid rgba(255, 255, 255, 0.6);
                border-bottom: 2px solid rgba(255, 255, 255, 0.6);
                rotate: 45deg;
                pointer-events: none;
                margin-top: -6px;
            }

            .field-error {
                margin: 6px 4px 0;
                font-size: 12.5px;
                color: #ff8fa3;
                font-weight: 500;
                display: none;
            }

            .field-error.visible {
                display: block;
            }

            .field-static-label {
                display: block;
                margin: 0 0 8px 4px;
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.4px;
                color: rgba(255, 255, 255, 0.55);
            }

            .phone-row {
                display: flex;
                align-items: stretch;
                gap: 0;
                position: relative;
            }

            .phone-field__country {
                flex: 0 0 auto;
                width: 112px;
                box-sizing: border-box;
                padding: 17px 26px 17px 10px;
                font-size: 13.5px;
                font-weight: 600;
                color: #ffffff;
                background: rgba(255, 255, 255, 0.055);
                border: 1.5px solid rgba(255, 255, 255, 0.14);
                border-right: none;
                border-radius: 14px 0 0 14px;
                appearance: none;
                -webkit-appearance: none;
                -moz-appearance: none;
                cursor: pointer;
                transition:
                    border-color 0.25s,
                    background 0.25s,
                    box-shadow 0.25s;
            }

            .phone-field__country option {
                color: #0b1530;
                background: #ffffff;
            }

            .phone-field__local {
                flex: 1;
                min-width: 0;
                border-radius: 0 14px 14px 0 !important;
                padding: 17px 44px 17px 18px !important;
            }

            .phone-field__local::placeholder {
                color: rgba(255, 255, 255, 0.35);
                font-weight: 400;
            }

            .phone-row:focus-within .phone-field__country,
            .phone-row:focus-within .phone-field__local {
                border-color: rgba(163, 230, 53, 0.75);
                background: rgba(255, 255, 255, 0.1);
            }

            .phone-row:focus-within .phone-field__local {
                box-shadow: 0 0 0 4px rgba(163, 230, 53, 0.13);
            }

            .phone-row.has-error .phone-field__country,
            .phone-row.has-error .phone-field__local {
                border-color: rgba(255, 110, 140, 0.7);
            }

            .phone-row .field-valid {
                right: 16px;
            }

            .phone-country-arrow {
                position: absolute;
                left: 92px;
                top: 50%;
                width: 7px;
                height: 7px;
                border-right: 2px solid rgba(255, 255, 255, 0.55);
                border-bottom: 2px solid rgba(255, 255, 255, 0.55);
                rotate: 45deg;
                pointer-events: none;
                margin-top: -5px;
            }

            .submit-wrap {
                margin-top: 28px;
                animation: twFieldIn 0.6s 0.75s cubic-bezier(0.22, 1, 0.36, 1)
                    both;
            }

            .btn-submit {
                position: relative;
                width: 100%;
                padding: 17px;
                border: none;
                border-radius: 14px;
                background: linear-gradient(
                    135deg,
                    #8bc540 0%,
                    #a8dc4a 50%,
                    #8bc540 100%
                );
                background-size: 200% 200%;
                color: #0b1530;
                font-size: 16px;
                font-weight: 700;
                letter-spacing: 0.3px;
                cursor: pointer;
                box-shadow:
                    0 10px 30px rgba(139, 197, 64, 0.35),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35);
                transition:
                    transform 0.2s,
                    box-shadow 0.25s,
                    background-position 0.4s;
                overflow: hidden;
            }

            .btn-submit:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow:
                    0 16px 40px rgba(139, 197, 64, 0.5),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35);
                background-position: 100% 100%;
            }

            .btn-submit:active:not(:disabled) {
                transform: translateY(0) scale(0.98);
            }

            .btn-submit:disabled {
                opacity: 0.7;
                cursor: not-allowed;
            }

            .btn-submit-inner {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                justify-content: center;
            }

            .btn-spinner {
                width: 17px;
                height: 17px;
                border: 2.5px solid rgba(11, 21, 48, 0.25);
                border-top-color: #0b1530;
                border-radius: 50%;
                display: inline-block;
                animation: twSpin 0.7s linear infinite;
            }

            .form-note {
                margin: 16px 0 0;
                text-align: center;
                font-size: 12px;
                color: rgba(255, 255, 255, 0.45);
                line-height: 1.5;
            }

            .error-box {
                margin-top: 20px;
                padding: 14px 18px;
                border-radius: 12px;
                border: 1px solid rgba(255, 110, 140, 0.5);
                background: rgba(255, 110, 140, 0.1);
                color: #ff8fa3;
                font-size: 13.5px;
                font-weight: 500;
                text-align: center;
                display: none;
            }

            .error-box.visible {
                display: block;
                animation: twShake 0.45s ease;
            }

            #success {
                padding: 40px 40px 36px;
                text-align: center;
            }

            .success-check-wrap {
                animation: twPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            .success-check-circle {
                width: 64px;
                height: 64px;
                margin: 0 auto;
                border-radius: 50%;
                background: rgba(139, 197, 64, 0.15);
                border: 1.5px solid rgba(139, 197, 64, 0.5);
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 0 30px rgba(139, 197, 64, 0.35);
            }

            .success-check-circle path {
                stroke-dasharray: 30;
                stroke-dashoffset: 30;
                animation: twCheckDraw 0.5s 0.3s ease forwards;
            }

            .success-title {
                margin: 20px 0 0;
                font-size: 27px;
                font-weight: 800;
                color: #ffffff;
                animation: twFieldIn 0.5s 0.15s both;
            }

            .success-desc {
                margin: 8px 0 0;
                font-size: 14px;
                color: rgba(255, 255, 255, 0.65);
                animation: twFieldIn 0.5s 0.25s both;
            }

            .qr-wrap {
                position: relative;
                display: inline-block;
                margin-top: 26px;
                padding: 16px;
                background: #ffffff;
                border-radius: 18px;
                box-shadow:
                    0 20px 50px rgba(0, 0, 0, 0.45),
                    0 0 0 1px rgba(139, 197, 64, 0.3),
                    0 0 40px rgba(139, 197, 64, 0.2);
                animation: twPop 0.55s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            .success-qr {
                width: 168px;
                height: 168px;
                object-fit: contain;
                display: block;
            }

            .qr-scan {
                position: absolute;
                left: 8px;
                right: 8px;
                height: 3px;
                border-radius: 3px;
                background: linear-gradient(
                    90deg,
                    rgba(139, 197, 64, 0),
                    #8bc540,
                    rgba(139, 197, 64, 0)
                );
                box-shadow: 0 0 12px rgba(139, 197, 64, 0.8);
                animation: twScan 3s ease-in-out infinite;
                pointer-events: none;
            }

            .summary-box {
                margin-top: 22px;
                padding: 14px 18px;
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                text-align: left;
                animation: twFieldIn 0.5s 0.5s both;
            }

            .summary-label {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 2px;
                color: rgba(255, 255, 255, 0.4);
                text-transform: uppercase;
            }

            .summary-name {
                margin-top: 6px;
                font-size: 15px;
                font-weight: 600;
                color: #ffffff;
            }

            .summary-meta {
                font-size: 13px;
                color: rgba(255, 255, 255, 0.6);
            }

            .summary-id {
                margin-top: 4px;
                font-size: 12.5px;
                color: #c4f24a;
                font-weight: 600;
            }

            .success-actions {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                margin-top: 20px;
                animation: twFieldIn 0.5s 0.6s both;
            }

            .btn-download {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 13px 28px;
                border: none;
                border-radius: 14px;
                background: linear-gradient(
                    135deg,
                    #8bc540 0%,
                    #a8dc4a 50%,
                    #8bc540 100%
                );
                background-size: 200% 200%;
                color: #0b1530;
                font-size: 15px;
                font-weight: 700;
                cursor: pointer;
                box-shadow: 0 10px 30px rgba(139, 197, 64, 0.35);
                transition:
                    transform 0.2s,
                    box-shadow 0.25s,
                    background-position 0.4s;
            }

            .btn-download:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 16px 40px rgba(139, 197, 64, 0.5);
                background-position: 100% 100%;
            }

            .btn-download:disabled {
                opacity: 0.7;
                cursor: not-allowed;
            }

            .btn-reset {
                padding: 11px 22px;
                border-radius: 999px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                background: transparent;
                color: rgba(255, 255, 255, 0.75);
                font-size: 13.5px;
                font-weight: 600;
                cursor: pointer;
                transition:
                    border-color 0.2s,
                    color 0.2s,
                    background 0.2s;
            }

            .btn-reset:hover {
                border-color: rgba(139, 197, 64, 0.6);
                color: #c4f24a;
                background: rgba(139, 197, 64, 0.08);
            }
        </style>
    </head>
    <body>
        <!-- Google Tag Manager (noscript) -->
        <noscript
            ><iframe
                src="https://www.googletagmanager.com/ns.html?id=GTM-MZZSBB5P"

                style="display: none; visibility: hidden"
            ></iframe

        <div class="page">
            <div class="page-overlay"></div>
            <div class="glow glow--lime"></div>
            <div class="glow glow--blue"></div>
            <div id="particles"></div>

            <div class="card" id="card">
                <div class="card-accent"></div>

                <div id="loading" class="card-body loader">
                    <div class="loader-spinner"></div>
                    <div>Cargando datos del evento...</div>
                </div>

                <div id="form-container" class="hidden">
                    <div class="card-body">
                        <div class="header-block">

            const DEFAULT_PHONE_COUNTRY = "CL";

            const fieldDefs = [
                { id: "nombre", label: "Nombre y Apellido" },

            function digitsOnly(value) {
                return String(value || "").replace(/\D/g, "");
            }

            function groupDigits(digits, groups) {
                const out = [];
                let rest = String(digits || "");
                for (const size of groups) {
                    if (!rest.length) break;
                    out.push(rest.slice(0, size));
                    rest = rest.slice(size);
                }
                if (rest.length) out.push(rest);
                return out.join(" ");
            }

            function getPhoneCountry(code) {
                return (
                    PHONE_COUNTRIES.find(
                        (c) => c.code === String(code || "").toUpperCase(),
                    ) ||
                    PHONE_COUNTRIES.find(
                        (c) => c.code === DEFAULT_PHONE_COUNTRY,
                    )
                );
            }

            function toTitleCaseName(value) {
                return String(value || "")
                    .trim()
                    .replace(/\s+/g, " ")
                    .split(" ")
                    .filter(Boolean)
                    .map((word) => {
                        const lower = word.toLocaleLowerCase("es");
                        return (
                            lower.charAt(0).toLocaleUpperCase("es") +
                            lower.slice(1)
                        );
                    })
                    .join(" ");
            }

            function isValidFullName(value) {
                const trimmed = String(value || "")
                    .trim()
                    .replace(/\s+/g, " ");
                return /^\S+\s+\S+/.test(trimmed) && isLettersAndSpaces(trimmed);
            }

            function isLettersAndSpaces(value) {
                const trimmed = String(value || "")
                    .trim()
                    .replace(/\s+/g, " ");
                if (!trimmed) return false;
                return /^[\p{L}]+(?:\s+[\p{L}]+)*$/u.test(trimmed);
            }

            function normalizeEmpresa(value) {
                return String(value || "")
                    .trim()
                    .replace(/\s+/g, " ");
            }

            function formatLocalPhoneInput(raw, countryCode) {
                const cfg = getPhoneCountry(countryCode);
                let digits = digitsOnly(raw);

                if (
                    digits.indexOf(cfg.callingCode) === 0 &&
                    digits.length > cfg.nationalDigitsMax
                ) {
                    digits = digits.slice(cfg.callingCode.length);
                }
                if (digits.charAt(0) === "0") digits = digits.slice(1);

                digits = digits.slice(0, cfg.nationalDigitsMax);
                if (!digits.length) return "";

                let groups = cfg.groups;
                if (cfg.code === "CL") {
                    groups =
                        digits.charAt(0) === "2" || digits.charAt(0) === "9"
                            ? [1, 4, 4]
                            : [2, 3, 4];
                } else if (cfg.code === "PE") {
                    if (digits.length === 9) groups = [3, 3, 3];
                    else if (digits.charAt(0) === "1") groups = [1, 3, 4];
                    else groups = [2, 3, 3];
                } else if (cfg.code === "BR" && digits.length <= 10) {
                    groups = [2, 4, 4];
                }

                return groupDigits(digits, groups);
            }

            function isValidNationalPhone(localValue, countryCode) {
                const cfg = getPhoneCountry(countryCode);
                const digits = digitsOnly(localValue);
                if (!digits) return false;

                if (cfg.code === "CL") {
                    return digits.length === 9 && /^[2-79]/.test(digits);
                }
                if (cfg.code === "PE") {
                    if (digits.length === 9) return digits.charAt(0) === "9";
                    if (digits.length === 8) return /^[14-8]/.test(digits);
                    return false;
                }

                if (
                    digits.length < cfg.nationalDigits ||
                    digits.length > cfg.nationalDigitsMax
                ) {
                    return false;
                }
                if (cfg.mobileLeading && !cfg.mobileLeading.test(digits)) {
                    return false;
                }
                return true;
            }

            function localMaxLength(countryCode) {
                const cfg = getPhoneCountry(countryCode);
                return cfg.nationalDigitsMax + cfg.groups.length - 1;
            }

            function fullPhoneValue() {
                const country = getPhoneCountry(
                    document.getElementById("telefono_pais").value,
                );
                const local = formatLocalPhoneInput(
                    document.getElementById("telefono").value,
                    country.code,
                );
                if (!local) return "";
                return `+${country.callingCode} ${local}`;
            }

            function applyPhoneCountryUi() {
                const select = document.getElementById("telefono_pais");
                const input = document.getElementById("telefono");
                const cfg = getPhoneCountry(select.value);
                input.placeholder = cfg.example;
                input.maxLength = localMaxLength(cfg.code);
                const formatted = formatLocalPhoneInput(input.value, cfg.code);
                if (input.value !== formatted) input.value = formatted;
            }

            function initPhoneCountries() {
                const select = document.getElementById("telefono_pais");
                select.innerHTML = "";
                PHONE_COUNTRIES.forEach((country) => {
                    const opt = document.createElement("option");
                    opt.value = country.code;
                    opt.textContent = country.label;
                    if (country.code === DEFAULT_PHONE_COUNTRY) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });
                applyPhoneCountryUi();
            }

            function requiredMessage(id) {
                if (id === "nombre") return "Ingresa nombre y apellido";
                if (id === "empresa") return "Ingresa la empresa";
                if (id === "cargo") return "Ingresa el cargo";
                if (id === "telefono") return "Ingresa un teléfono";
                if (id === "email") return "Ingresa un correo electrónico";
                if (id === "bloque")
                    return "Selecciona el bloque al que asistirás";
                return "Este campo es obligatorio";
            }

            function validateField(id, value) {
                const val = (value || "").trim();
                if (id === "bloque") {
                    if (!bloquesEvento.length) return null;
                    if (!val) return requiredMessage(id);
                    return null;
                }
                if (id === "telefono") {
                    const countryCode =
                        document.getElementById("telefono_pais").value;
                    const local = (value || "").trim();
                    if (!local) return requiredMessage(id);
                    if (!isValidNationalPhone(local, countryCode)) {
                        const cfg = getPhoneCountry(countryCode);
                        return `Ingresa un teléfono válido con formato ${cfg.example}`;
                    }
                    return null;
                }
                if (!val) return requiredMessage(id);
                if (
                    (id === "nombre" || id === "cargo") &&
                    !isLettersAndSpaces(val)
                ) {
                    return "Usa solo letras, sin números ni símbolos";
                }
                if (id === "nombre" && !isValidFullName(val)) {
                    return "Ingresa nombre y apellido";
                }
                if (id === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val))
                    return "Ingresa un correo válido";
                return null;
            }

            function applyErrorMessage(id, message) {
                const errorEl = document.querySelector(
                    `[data-error-for="${id}"]`,
                );
                if (!errorEl) return;
                if (message) {
                    errorEl.textContent = message;
                    errorEl.classList.add("visible");
                } else {
                    errorEl.textContent = "";
                    errorEl.classList.remove("visible");
                }
            }

            function updateSelectState(select) {
                const filled = select.value.trim().length > 0;
                const err = validateField(select.id, select.value);
                const showError =
                    !!err &&
                    (filled || select.dataset.touched === "1");
                select.classList.toggle("filled", filled);
                select.classList.toggle("error", showError);
                applyErrorMessage(select.id, showError ? err : null);
            }

            function updatePhoneFieldState() {
                const input = document.getElementById("telefono");
                const row = document.getElementById("phoneRow");
                const err = validateField("telefono", input.value);
                const filled = input.value.trim().length > 0;
                const showError =
                    !!err &&
                    (filled || input.dataset.touched === "1");
                input.classList.toggle("filled", filled);
                input.classList.toggle("valid", filled && !err);
                input.classList.toggle("error", showError);
                row.classList.toggle("has-error", showError);
                applyErrorMessage("telefono", showError ? err : null);
            }

            function updateFieldState(input) {
                if (input.id === "telefono") {
                    updatePhoneFieldState();
                    return;
                }
                const err = validateField(input.id, input.value);
                const filled = input.value.trim().length > 0;
                const showError =
                    !!err &&
                    (filled || input.dataset.touched === "1");
                input.classList.toggle("filled", filled);
                input.classList.toggle("valid", filled && !err);
                input.classList.toggle("error", showError);
                applyErrorMessage(input.id, showError ? err : null);
            }

            function makeParticles(count = 26) {
                const container = document.getElementById("particles");
                let seed = 12345;
                const rnd = () => {
                    seed = (seed * 1664525 + 1013904223) >>> 0;
                    return seed / 4294967296;
                };

                for (let i = 0; i < count; i++) {
                    const size = 2 + rnd() * 4;
                    const lime = rnd() > 0.45;
                    const dot = document.createElement("div");
                    dot.style.cssText = [
                        "position:absolute",
                        `left:${rnd() * 100}%`,
                        "bottom:-20px",
                        `width:${size}px`,
                        `height:${size}px`,
                        "border-radius:50%",
                        lime
                            ? "background:rgba(163,230,53,.85)"
                            : "background:rgba(140,180,255,.7)",
                        lime
                            ? "box-shadow:0 0 10px rgba(163,230,53,.8)"
                            : "box-shadow:0 0 8px rgba(140,180,255,.7)",
                        `animation:twFloat ${14 + rnd() * 18}s linear ${-rnd() * 30}s infinite`,
                        "pointer-events:none",
                    ].join(";");
                    container.appendChild(dot);
                }
            }

            function setFieldError(id, message) {
                const input = document.getElementById(id);
                const inner = document.querySelector(
                    `[data-field="${id}"]`,
                );
                const phoneRow = document.getElementById("phoneRow");

                if (message) {
                    input.dataset.touched = "1";
                    input.classList.add("error");
                    if (id === "telefono" && phoneRow) {
                        phoneRow.classList.add("has-error");
                    }
                    applyErrorMessage(id, message);
                    inner.classList.add("shake");
                    setTimeout(() => inner.classList.remove("shake"), 500);
                } else {
                    if (id === "telefono" && phoneRow) {
                        phoneRow.classList.remove("has-error");
                    }
                    if (input.tagName === "SELECT") {
                        updateSelectState(input);
                    } else {
                        updateFieldState(input);
                    }
                }
            }

            function clearAllFieldErrors() {
                fieldDefs.forEach((f) => setFieldError(f.id, null));
                setFieldError("bloque", null);
            }

            function validateForm() {
                let valid = true;
                fieldDefs.forEach((f) => {
                    const input = document.getElementById(f.id);
                    const err = validateField(f.id, input.value);
                    if (err) {
                        setFieldError(f.id, err);
                        valid = false;
                    } else {
                        setFieldError(f.id, null);
                    }
                });

                const bloque = document.getElementById("bloque");
                if (bloquesEvento.length) {
                    const bloqueErr = validateField("bloque", bloque.value);
                    if (bloqueErr) {
                        setFieldError("bloque", bloqueErr);
                        valid = false;
                    } else {
                        setFieldError("bloque", null);
                    }
                }

                return valid;
            }

            async function enviarCorreoQr(payload) {
                // Bridge propio: src/registro/enviar-qr.js (Brevo), sin mailer de la intranet.
                const mailRes = await fetch("/registro-forms/enviar-qr", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                if (!mailRes.ok) {
                    const body = await mailRes.json().catch(() => ({}));
                    throw new Error(body.error || `HTTP ${mailRes.status}`);
                }
            }

            function firstNameFrom(fullName) {
                return (fullName || "").trim().split(/\s+/)[0] || "";
            }

            function ticketIdFrom(id) {
                const short = id.replace(/-/g, "").slice(0, 8).toUpperCase();
                return `TWC-${short}`;
            }

            function etiquetaBloque(bloqueId) {
                const bloque = bloquesEvento.find((b) => b.id === bloqueId);
                return bloque ? bloque.etiqueta : "";
            }

            const PLACEHOLDER_BLOQUE =
                "Selecciona el bloque al que asistirás";

            function toggleBloqueField(mostrar) {
                const wrap = document.getElementById("bloque-wrap");
                wrap.classList.toggle("hidden", !mostrar);
            }

            function renderBloques(bloques) {
                const select = document.getElementById("bloque");

                if (!bloques.length) {
                    select.innerHTML = "";
                    select.disabled = true;
                    select.removeAttribute("required");
                    toggleBloqueField(false);
                    return;
                }

                toggleBloqueField(true);
                select.innerHTML = "";

                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = PLACEHOLDER_BLOQUE;
                placeholder.disabled = true;
                placeholder.selected = true;
                select.appendChild(placeholder);

                bloques.forEach((bloque) => {
                    const opt = document.createElement("option");
                    opt.value = bloque.id;
                    opt.textContent = bloque.etiqueta;
                    select.appendChild(opt);
                });

                select.disabled = false;
                select.required = true;
            }

            async function cargarEvento() {
                if (!EVENTO_ID) {
                    mostrarError(
                        "Enlace incompleto. No se especificó un evento.",
                    );
                    return;
                }

                try {
                    const res = await fetch(
                        `/registro-forms/api/evento/${encodeURIComponent(EVENTO_ID)}`,
                    );
                    const payload = await res.json().catch(() => ({}));

                    if (!res.ok || !payload.ok) {
                        throw new Error(
                            payload.error || `HTTP ${res.status}`,
                        );
                    }

                    const data = payload.evento || {};
                    eventoNombre = data.nombre || "";
                    eventoFechaRaw = data.fecha || "";
                    eventoFecha = eventoFechaRaw;
                    eventoLugar = data.lugar || "";
                    eventoDireccion = data.direccion || "";

                    if (
                        eventoFecha.includes("-") &&
                        eventoFecha.split("-")[0].length === 4
                    ) {
                        const [anio, mes, dia] = eventoFecha.split("-");
                        eventoFecha = `${dia}-${mes}-${anio}`;
                    }

                    document.getElementById("nombreEventoTitulo").innerText =
                        eventoNombre;
                    document.getElementById("fechaEventoTitulo").innerText =
                        eventoFecha ? ` · ${eventoFecha}` : "";
                    document.getElementById("loading").classList.add("hidden");
                    document
                        .getElementById("form-container")
                        .classList.remove("hidden");

                    bloquesEvento = payload.bloques || [];
                    renderBloques(bloquesEvento);
                } catch (err) {
                    console.error("Error cargando evento:", err);
                    mostrarError(
                        "No se pudo cargar la información del evento. Verifique el enlace.",
                    );
                }
            }

            const convertirABase64 = (blob) =>
                new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = (error) => reject(error);
                });

            function setSubmitting(submitting) {
                const btn = document.getElementById("btnEnviar");
                btn.disabled = submitting;
                btn.innerHTML = submitting
                    ? '<span class="btn-submit-inner"><span class="btn-spinner"></span>Generando tu QR…</span>'
                    : "Registrarme y obtener QR";
            }

            function mostrarExito(datos, base64Qr) {
                const nombre = datos.nombre_completo;
                const first = firstNameFrom(nombre);

                document.getElementById("successTitle").innerText =
                    first ? `¡Estás dentro, ${first}!` : "¡Estás dentro!";
                document.getElementById("summaryName").innerText = nombre;
                document.getElementById("summaryMeta").innerText = [
                    datos.cargo,
                    datos.empresa,
                    datos.bloque_etiqueta,
                ]
                    .filter(Boolean)
                    .join(" · ");
                document.getElementById("summaryId").innerText =
                    `ID ${ticketIdFrom(registroId)}`;
                qrBase64 = base64Qr;
                document.getElementById("successQr").src = base64Qr;

                document.getElementById("form-container").classList.add("hidden");
                document.getElementById("success").classList.remove("hidden");
                document.getElementById("error").classList.remove("visible");
            }

            function resetFormulario() {
                document.getElementById("registroForm").reset();
                clearAllFieldErrors();
                fieldDefs.forEach((f) => {
                    const input = document.getElementById(f.id);
                    input.classList.remove("filled", "valid", "error");
                    delete input.dataset.touched;
                });
                document.getElementById("telefono_pais").value =
                    DEFAULT_PHONE_COUNTRY;
                applyPhoneCountryUi();
                document.getElementById("phoneRow").classList.remove("has-error");
                const bloque = document.getElementById("bloque");
                bloque.selectedIndex = 0;
                bloque.classList.remove("filled", "error");
                delete bloque.dataset.touched;
                toggleBloqueField(bloquesEvento.length > 0);
                if (bloquesEvento.length) {
                    bloque.disabled = false;
                    bloque.required = true;
                } else {
                    bloque.disabled = true;
                    bloque.removeAttribute("required");
                }
                qrBase64 = "";
                document.getElementById("successQr").removeAttribute("src");
                document.getElementById("success").classList.add("hidden");
                document
                    .getElementById("form-container")
                    .classList.remove("hidden");
                setSubmitting(false);
            }

            fieldDefs.forEach((f) => {
                const input = document.getElementById(f.id);
                if (f.id === "telefono") {
                    input.addEventListener("input", () => {
                        const countryCode =
                            document.getElementById("telefono_pais").value;
                        const formatted = formatLocalPhoneInput(
                            input.value,
                            countryCode,
                        );
                        if (input.value !== formatted) input.value = formatted;
                        updatePhoneFieldState();
                    });
                    input.addEventListener("blur", () => {
                        input.dataset.touched = "1";
                        updatePhoneFieldState();
                    });
                    return;
                }
                input.addEventListener("input", () => updateFieldState(input));
                input.addEventListener("blur", () => {
                    input.dataset.touched = "1";
                    if (
                        (f.id === "nombre" || f.id === "cargo") &&
                        input.value.trim()
                    ) {
                        input.value = toTitleCaseName(input.value);
                    }
                    if (f.id === "empresa" && input.value.trim()) {
                        input.value = normalizeEmpresa(input.value);
                    }
                    if (f.id === "email" && input.value.trim()) {
                        input.value = input.value.trim().toLowerCase();
                    }
                    updateFieldState(input);
                });
            });

            document
                .getElementById("telefono_pais")
                .addEventListener("change", () => {
                    applyPhoneCountryUi();
                    updatePhoneFieldState();
                });

            const bloqueSelect = document.getElementById("bloque");
            bloqueSelect.addEventListener("change", () => {
                bloqueSelect.dataset.touched = "1";
                updateSelectState(bloqueSelect);
            });
            bloqueSelect.addEventListener("blur", () => {
                bloqueSelect.dataset.touched = "1";
                updateSelectState(bloqueSelect);
            });

            function applyAllFieldFormats() {
                const nombreInput = document.getElementById("nombre");
                if (nombreInput.value.trim()) {
                    nombreInput.value = toTitleCaseName(nombreInput.value);
                }

                const empresaInput = document.getElementById("empresa");
                if (empresaInput.value.trim()) {
                    empresaInput.value = normalizeEmpresa(empresaInput.value);
                }

                const cargoInput = document.getElementById("cargo");
                if (cargoInput.value.trim()) {
                    cargoInput.value = toTitleCaseName(cargoInput.value);
                }

                const emailInput = document.getElementById("email");
                if (emailInput.value.trim()) {
                    emailInput.value = emailInput.value.trim().toLowerCase();
                }

                const telefonoInput = document.getElementById("telefono");
                const countryCode =
                    document.getElementById("telefono_pais").value;
                telefonoInput.value = formatLocalPhoneInput(
                    telefonoInput.value,
                    countryCode,
                );
            }

            const form = document.getElementById("registroForm");
            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                document.getElementById("error").classList.remove("visible");

                applyAllFieldFormats();

                if (!validateForm()) return;

                setSubmitting(true);

                const countryCode =
                    document.getElementById("telefono_pais").value;
                const emailIngresado = document
                    .getElementById("email")
                    .value.trim()
                    .toLowerCase();

                try {
                    const bloqueId = bloquesEvento.length
                        ? document.getElementById("bloque").value.trim()
                        : "";

                    const formData = {
                        nombre_completo: toTitleCaseName(
                            document.getElementById("nombre").value,
                        ),
                        empresa: normalizeEmpresa(
                            document.getElementById("empresa").value,
                        ),
                        cargo: toTitleCaseName(
                            document.getElementById("cargo").value,
                        ),
                        telefono: fullPhoneValue(),
                        telefono_pais: countryCode,
                        email: emailIngresado,
                        bloque_id: bloqueId || null,
                        evento_id: EVENTO_ID,
                        utm_source:
                            document.getElementById("utm_source").value ||
                            null,
                        utm_medium:
                            document.getElementById("utm_medium").value ||
                            null,
                        utm_campaign:
                            document.getElementById("utm_campaign").value ||
                            null,
                        utm_content:
                            document.getElementById("utm_content").value ||
                            null,
                    };

                    const registroRes = await fetch(
                        "/registro-forms/api/registrar",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(formData),
                        },
                    );
                    const registroPayload = await registroRes
                        .json()
                        .catch(() => ({}));

                    if (!registroRes.ok || !registroPayload.ok) {
                        throw new Error(
                            registroPayload.error ||
                                `Error al registrar (HTTP ${registroRes.status})`,
                        );
                    }

                    registroId = registroPayload.id;

                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&format=jpeg&data=${registroId}`;
                    const responseQr = await fetch(qrUrl);
                    const blobQr = await responseQr.blob();
                    const base64Qr = await convertirABase64(blobQr);

                    const datosExito = {
                        ...formData,
                        id: registroId,
                        bloque_etiqueta: etiquetaBloque(bloqueId),
                    };

                    // Envío de QR por Brevo (directo, sin intranet)
                    try {
                        await enviarCorreoQr({
                            email: emailIngresado,
                            nombre: formData.nombre_completo,
                            eventoNombre,
                            eventoFecha,
                            eventoFechaRaw,
                            eventoLugar,
                            eventoDireccion,
                            registroId,
                        });
                    } catch (mailErr) {
                        console.error("[registro] error envío correo:", mailErr);
                    }

                    // Solo tras registro OK en BD + QR listo (no al clic Enviar)
                    window.dataLayer = window.dataLayer || [];
                    window.dataLayer.push({
                        event: "transworld_connect_registro",
                    });

                    mostrarExito(datosExito, base64Qr);
                } catch (err) {
                    console.error(err);
                    mostrarError("Error al registrar: " + err.message);
                    setSubmitting(false);
                }
            });

            async function asegurarQrListo() {
                const img = document.getElementById("successQr");
                if (!qrBase64) return;

                img.removeAttribute("src");
                img.src = qrBase64;

                if (img.decode) {
                    try {
                        await img.decode();
                    } catch (_) {
                        /* ignorar */
                    }
                } else {
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                    });
                }
            }

            function wrapText(ctx, text, maxWidth) {
                const words = (text || "").split(" ");
                const lines = [];
                let line = "";

                words.forEach((word) => {
                    const test = line ? `${line} ${word}` : word;
                    if (ctx.measureText(test).width > maxWidth && line) {
                        lines.push(line);
                        line = word;
                    } else {
                        line = test;
                    }
                });

                if (line) lines.push(line);
                return lines.length ? lines : [""];
            }

            async function generarImagenPasePlano() {
                await asegurarQrListo();

                const qrImg = document.getElementById("successQr");
                if (!qrImg || !qrBase64) {
                    throw new Error("QR no disponible");
                }

                const title = document.getElementById("successTitle").innerText;
                const desc =
                    document.querySelector(".success-desc")?.innerText || "";
                const name =
                    document.getElementById("summaryName")?.innerText || "";
                const meta =
                    document.getElementById("summaryMeta")?.innerText || "";
                const ticket =
                    document.getElementById("summaryId")?.innerText || "";

                const width = 420;
                const padding = 36;
                const contentWidth = width - padding * 2;
                const qrSize = 200;
                const qrPad = 12;
                const lineHeight = 20;

                const measureCanvas = document.createElement("canvas");
                const measureCtx = measureCanvas.getContext("2d");
                measureCtx.font = "400 13px Outfit, sans-serif";
                const metaLines = meta
                    ? wrapText(measureCtx, meta, contentWidth)
                    : [];

                const height =
                    padding +
                    28 +
                    18 +
                    24 +
                    (qrSize + qrPad * 2) +
                    28 +
                    16 +
                    18 +
                    (meta ? metaLines.length * lineHeight : 0) +
                    (ticket ? 24 : 0) +
                    padding;

                const canvas = document.createElement("canvas");
                const scale = 2;
                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext("2d");
                ctx.scale(scale, scale);

                ctx.fillStyle = "#0b1530";
                ctx.fillRect(0, 0, width, height);

                ctx.textAlign = "center";
                ctx.fillStyle = "#ffffff";
                ctx.font = "700 24px Outfit, sans-serif";
                ctx.fillText(title, width / 2, padding + 24);

                ctx.fillStyle = "rgba(255,255,255,0.75)";
                ctx.font = "400 14px Outfit, sans-serif";
                ctx.fillText(desc, width / 2, padding + 48);

                const qrBoxSize = qrSize + qrPad * 2;
                const qrX = (width - qrBoxSize) / 2;
                const qrY = padding + 68;
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(qrX, qrY, qrBoxSize, qrBoxSize);
                ctx.drawImage(qrImg, qrX + qrPad, qrY + qrPad, qrSize, qrSize);

                let y = qrY + qrBoxSize + 28;
                ctx.fillStyle = "rgba(255,255,255,0.5)";
                ctx.font = "600 11px Outfit, sans-serif";
                ctx.fillText("REGISTRO CONFIRMADO", width / 2, y);

                y += 22;
                ctx.fillStyle = "#ffffff";
                ctx.font = "600 15px Outfit, sans-serif";
                ctx.fillText(name, width / 2, y);

                if (meta) {
                    y += 22;
                    ctx.fillStyle = "rgba(255,255,255,0.7)";
                    ctx.font = "400 13px Outfit, sans-serif";
                    metaLines.forEach((line) => {
                        ctx.fillText(line, width / 2, y);
                        y += lineHeight;
                    });
                }

                if (ticket) {
                    y += 6;
                    ctx.fillStyle = "#c4f24a";
                    ctx.font = "600 13px Outfit, sans-serif";
                    ctx.fillText(ticket, width / 2, y);
                }

                return canvas.toDataURL("image/jpeg", 0.92);
            }

            document
                .getElementById("btnDescargarQr")
                .addEventListener("click", async () => {
                    const btn = document.getElementById("btnDescargarQr");
                    const scanLine = document.querySelector(".qr-scan");

                    const textoOriginal = btn.innerHTML;
                    btn.innerHTML = "Generando pase...";
                    btn.disabled = true;
                    if (scanLine) scanLine.style.visibility = "hidden";

                    try {
                        const imgData = await generarImagenPasePlano();
                        const a = document.createElement("a");
                        a.href = imgData;

                        const nombreArchivo = eventoNombre
                            ? `Pase_Acceso_${eventoNombre.replace(/\s+/g, "_")}.jpg`
                            : "Pase_Acceso.jpg";
                        a.download = nombreArchivo;

                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    } catch (error) {
                        console.error(
                            "Error al descargar la imagen completa:",
                            error,
                        );
                        alert(
                            "No se pudo generar la imagen automáticamente. Por favor, toma una captura de pantalla.",
                        );
                    } finally {
                        if (scanLine) scanLine.style.visibility = "";
                        btn.innerHTML = textoOriginal;
                        btn.disabled = false;
                    }
                });

            document
                .getElementById("btnReset")
                .addEventListener("click", resetFormulario);

            function mostrarError(msg) {
                document.getElementById("loading").classList.add("hidden");
                document
                    .getElementById("form-container")
                    .classList.remove("hidden");
                const errBox = document.getElementById("error");
                errBox.innerText = msg;
                errBox.classList.add("visible");
            }

            makeParticles(26);
            initPhoneCountries();
            cargarEvento();
        </script>
    </body>
</html>
